<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        
        <!-- Login Card -->
        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Top Glow Accent -->
            <div class="absolute -top-12 -right-12 w-36 h-36 bg-indigo-500/20 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-indigo-600/20 rounded-full blur-2xl"></div>

            <!-- Brand Icon & Header -->
            <div class="text-center relative z-10 mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <span class="material-icons text-3xl text-white">admin_panel_settings</span>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Admin Console</h1>
                <p class="text-slate-400 text-xs mt-1">Sign in with your administrator credentials</p>
            </div>

            <!-- Error Banner -->
            <div id="loginError" class="hidden mb-6 p-3.5 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs font-medium flex items-center gap-2.5">
                <span class="material-icons text-sm text-red-400">error</span>
                <span id="loginErrorText">Invalid Admin ID or Password</span>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-4 relative z-10">
                
                <!-- Admin ID / Username -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Admin ID / Username
                    </label>
                    <div class="relative">
                        <span class="material-icons absolute left-3.5 top-3 text-slate-400 text-sm">person</span>
                        <input type="text" id="adminId" name="username" required placeholder="Enter admin ID"
                            class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Password
                    </label>
                    <div class="relative">
                        <span class="material-icons absolute left-3.5 top-3 text-slate-400 text-sm">lock</span>
                        <input type="password" id="adminPass" name="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                        <button type="button" onclick="togglePassVisibility()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-200 transition-colors">
                            <span class="material-icons text-sm" id="eyeIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all flex items-center justify-center text-sm mt-6">
                    <span class="material-icons text-sm mr-2">login</span> Sign In
                </button>
            </form>

            <!-- Environment Variable Info -->
            <div class="mt-6 pt-6 border-t border-slate-700/50 text-center relative z-10">
                <p class="text-[11px] text-slate-400">
                    Protected by <code class="text-indigo-400 font-mono">ADMIN_ID</code> & <code class="text-indigo-400 font-mono">ADMIN_PASSWORD</code>
                </p>
            </div>

        </div>

    </div>

    <script>
        function togglePassVisibility() {
            const passInput = document.getElementById('adminPass');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const loginErrorText = document.getElementById('loginErrorText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="material-icons text-sm mr-2 animate-spin">refresh</span> Verifying...';

            const username = document.getElementById('adminId').value;
            const password = document.getElementById('adminPass').value;

            try {
                const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    localStorage.setItem('admin_token', data.token || 'authenticated');
                    localStorage.setItem('admin_user', data.admin || username);
                    window.location.href = 'index.html';
                } else {
                    loginErrorText.textContent = data.message || 'Invalid Admin ID or Password';
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                loginErrorText.textContent = 'Connection error: Could not reach backend server';
                loginError.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span class="material-icons text-sm mr-2">login</span> Sign In';
            }
        });
    </script>
</body>

</html>
